name: RoScouting collector

# Un run par heure, qui enchaîne un cycle toutes les 5 minutes pendant ~52 min.
# C'est plus fiable qu'un cron toutes les 5 min : les crons GitHub sont souvent
# retardés de 10 à 20 minutes, alors qu'un run déjà démarré, lui, tourne à l'heure.
on:
  schedule:
    # Six déclenchements par heure. Les crons GitHub sont en file d'attente basse
    # priorité et sont parfois purement sautés : en multiplier le nombre fait
    # qu'un saut coûte 10 minutes au lieu d'une heure. Le verrou « concurrency »
    # plus bas garantit qu'un seul run tourne à la fois.
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:
    inputs:
      cycles:
        description: "Nombre de cycles (1 pour un test rapide, 68 = run complet)"
        default: "68"

permissions:
  contents: write

concurrency:
  group: roscouting-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 5 h 50. Un seul déclenchement réussi couvre donc presque six heures.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      # Les données vivent sur une branche à part : un push dessus ne déclenche
      # pas de reconstruction de GitHub Pages (limitée à 10 builds par heure).
      - name: Préparer la branche de données
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" data >/dev/null 2>&1; then
            echo "branche data existante, on la récupère"
            git clone --branch data --single-branch --depth 1 "$URL" data
          else
            echo "première fois : création de la branche data"
            mkdir -p data
            git -C data init -q -b data
            git -C data remote add origin "$URL"
          fi
          git -C data config user.name "roscouting-bot"
          git -C data config user.email "bot@users.noreply.github.com"

      - name: Cycles de collecte
        env:
          ONCE: "1"
          MAX_DETAIL: "2600"
        run: |
          N="${{ github.event.inputs.cycles || 68 }}"
          DEADLINE=$(( $(date +%s) + 340*60 ))   # on s'arrête avant le timeout du job
          for i in $(seq 1 "$N"); do
            START=$(date +%s)
            echo "::group::cycle $i / $N"
            node collect.mjs || echo "cycle en échec, on continue"
            echo "::endgroup::"

            git -C data add -A
            if git -C data rev-parse HEAD >/dev/null 2>&1; then
              git -C data commit -q --amend --no-edit || true
            else
              git -C data commit -q -m "radar $(date -u +%FT%TZ)" || true
            fi
            git -C data push -q --force origin data

            ELAPSED=$(( $(date +%s) - START ))
            WAIT=$(( 300 - ELAPSED ))
            [ "$WAIT" -lt 0 ] && WAIT=0
            NEXT=$(( $(date +%s) + WAIT ))
            if [ "$NEXT" -ge "$DEADLINE" ]; then
              echo "fin de la fenêtre du run, on s'arrête proprement au cycle $i"
              break
            fi
            if [ "$i" -lt "$N" ] && [ "$WAIT" -gt 0 ]; then
              echo "cycle en ${ELAPSED}s, pause ${WAIT}s"
              sleep "$WAIT"
            fi
          done

      - name: Résumé
        if: always()
        run: |
          echo "### Dernier relevé" >> $GITHUB_STEP_SUMMARY
          node -e '
            const d=require("./data/radar.json");
            const c=d.counts;
            console.log(`- ${c.scanned} jeux analysés, ${c.universe} suivis au total`);
            console.log(`- ${c.rejectedModded} modded écartés, ${c.kept} retenus`);
            console.log(`- tendances : ${d.trending.map(t=>t.tag).slice(0,10).join(", ")}`);
          ' >> $GITHUB_STEP_SUMMARY || echo "pas de radar.json" >> $GITHUB_STEP_SUMMARY
